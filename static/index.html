<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            border-radius: 7px;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    <p class="subtitle">
        Register your account
    </p>

    <form id="registerForm">

        <div class="form-group">
            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                minlength="3"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                minlength="6"
                required
            >
        </div>

        <button
            type="submit"
            id="registerButton"
        >
            Register
        </button>

    </form>

    <div
        class="loading"
        id="loading"
    >
        Creating account...
    </div>

    <div
        class="message"
        id="message"
    ></div>

</div>

<script>

const form = document.getElementById("registerForm");

const usernameInput = document.getElementById("username");

const passwordInput = document.getElementById("password");

const registerButton = document.getElementById("registerButton");

const loading = document.getElementById("loading");

const message = document.getElementById("message");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.className = "message";
    message.textContent = "";

    const username = usernameInput.value.trim();

    const password = passwordInput.value;

    if (!username) {
        showError("Username is required.");
        return;
    }

    if (username.length < 3) {
        showError("Username must contain at least 3 characters.");
        return;
    }

    if (!password) {
        showError("Password is required.");
        return;
    }

    if (password.length < 6) {
        showError("Password must contain at least 6 characters.");
        return;
    }

    const requestData = {
        username: username,
        password: password
    };

    console.log("Sending:", requestData);

    registerButton.disabled = true;

    loading.style.display = "block";

    try {

        const response = await fetch("/api/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(requestData)
        });

        const data = await response.json();

        console.log("Status:", response.status);

        console.log("Response:", data);


        if (!response.ok) {

            let errorMessage = "Registration failed.";

            if (response.status === 422) {

                if (Array.isArray(data.detail)) {

                    errorMessage = data.detail
                        .map(item => item.msg)
                        .join(", ");

                } else {

                    errorMessage = data.detail || "Invalid request.";

                }

            } else if (response.status === 404) {

                errorMessage =
                    "Registration API not found. Check /api/register route.";

            } else if (response.status === 405) {

                errorMessage =
                    "POST method is not allowed on this endpoint.";

            } else if (response.status === 500) {

                errorMessage =
                    "Internal server error. Check FastAPI terminal.";

            } else if (data.detail) {

                errorMessage = data.detail;

            }

            throw new Error(errorMessage);
        }


        showSuccess(
            data.message ||
            "Registration successful!"
        );

        form.reset();

    } catch (error) {

        console.error("Registration error:", error);

        showError(
            error.message ||
            "Unable to register."
        );

    } finally {

        registerButton.disabled = false;

        loading.style.display = "none";

    }

});


function showSuccess(text) {

    message.className = "message success";

    message.textContent = text;

}


function showError(text) {

    message.className = "message error";

    message.textContent = text;

}

</script>

</body>
</html>
